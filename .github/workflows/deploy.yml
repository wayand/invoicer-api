name: CI/CD for invoicer-api.wayand.dk

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    lint:
        name: Run Ruff lint and format checks
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Install uv
            uses: astral-sh/setup-uv@v4
            with:
              python-version: "3.14"

          - name: Install dependencies
            run: uv sync --frozen

          - name: Run ruff check
            run: uv run ruff check .

          - name: Run ruff format check
            run: uv run ruff format --check .

    test:
        name: Run Unit tests
        runs-on: ubuntu-latest
        services:
          postgres:
            image: postgres:18
            env:
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
              POSTGRES_DB: test_invoicer_db
            ports:
              - 5432:5432
            options: >-
              --health-cmd "pg_isready -U postgres"
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5
        env:
            TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432
            TEST_DB_NAME: test_invoicer_db

        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Install uv
            uses: astral-sh/setup-uv@v4
            with:
              python-version: "3.14"

          - name: Install dependencies
            run: uv sync --frozen

          - name: Run tests
            run: uv run pytest -vs

    build-and-push:
        name: Build and push Docker image
        runs-on: ubuntu-24.04-arm   # native arm64 runner: the Hetzner server is aarch64
        needs: [lint, test]
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        permissions:
            contents: read
            packages: write
        outputs:
            short_sha: ${{ steps.short_sha.outputs.value }}

        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Set short SHA
            id: short_sha
            run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

          - name: Log in to GitHub Container Registry
            uses: docker/login-action@v3
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Build and push
            uses: docker/build-push-action@v6
            with:
              context: .
              push: true
              tags: |
                ghcr.io/wayand/invoicer-api:latest
                ghcr.io/wayand/invoicer-api:${{ steps.short_sha.outputs.value }}

    deploy:
        name: Deploy to invoicer-api.wayand.dk
        runs-on: ubuntu-latest
        needs: [lint, test, build-and-push]   # ensures deploy only runs if lint, tests pass and the image was built
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'

        steps:
        - name: Set up SSH
          run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H ${{ secrets.HETZNER_IP_ADDRESS }} >> ~/.ssh/known_hosts

        - name: Run deploy script
          run: ssh www-data@${{ secrets.HETZNER_IP_ADDRESS }} "IMAGE_TAG=${{ needs.build-and-push.outputs.short_sha }} bash /srv/docker/invoicer/deploy.sh"
